<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>シナリオエディタ</title>
    <style>
      :root {
        --bg: #1b1d24;
        --surface: #262933;
        --surface-2: #30343f;
        --text: #ecebe8;
        --text-sub: #a9abb3;
        --accent: #d9a35b;
        --warn: #e5b56b;
        font-family: 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', 'Noto Sans JP', Meiryo, sans-serif;
        color: var(--text);
        background: var(--bg);
      }
      * { box-sizing: border-box; }
      html, body { height: 100%; margin: 0; }
      body { display: flex; flex-direction: column; padding: 10px; gap: 8px; max-width: 960px; margin: 0 auto; }
      button, input, select, textarea { font: inherit; color: inherit; }
      button { cursor: pointer; }
      header { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
      h1 { font-size: 16px; margin: 0 8px 0 0; }
      .bar { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
      .btn {
        padding: 6px 10px;
        border: 1px solid var(--surface-2);
        border-radius: 8px;
        background: var(--surface);
        font-size: 13px;
        white-space: nowrap;
      }
      .btn:active { background: var(--surface-2); }
      .btn.cmd { border-color: rgba(217, 163, 91, 0.45); }
      .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--bg); font-weight: bold; }
      input[type='text'], select {
        padding: 6px 8px;
        border: 1px solid var(--surface-2);
        border-radius: 8px;
        background: var(--bg);
        font-size: 13px;
      }
      .story { font-size: 12px; color: var(--text-sub); }
      #picker { display: none; padding: 8px; border-radius: 10px; background: var(--surface); }
      #picker.open { display: flex; }
      #picker .label { font-size: 12px; color: var(--text-sub); width: 100%; margin-bottom: 2px; }
      textarea {
        flex: 1;
        min-height: 300px;
        width: 100%;
        padding: 12px;
        border: 1px solid var(--surface-2);
        border-radius: 10px;
        background: #14161c;
        font-size: 15px;
        line-height: 1.8;
        resize: none;
        tab-size: 2;
      }
      textarea:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
      #problems { margin: 0; padding: 0 0 0 1.2em; color: var(--warn); font-size: 12px; line-height: 1.6; max-height: 6.5em; overflow: auto; }
      #problems:empty { display: none; }
      footer { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
      .toast {
        position: fixed;
        left: 50%;
        bottom: 16px;
        z-index: 10;
        transform: translateX(-50%);
        max-width: calc(100% - 32px);
        padding: 8px 14px;
        border-radius: 999px;
        background: var(--surface-2);
        color: var(--accent);
        font-size: 13px;
        pointer-events: none;
      }
      .toast:empty { display: none; }
      .mobile-bar { display: none; }

      /* ---------- スマホ（キーボードの上にコマンドバーを出す） ---------- */
      /* 画面全体を「キーボードに隠れていない範囲」（--vvh）に合わせ、本文は入力欄の中だけでスクロールする */
      body.mobile {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        height: var(--vvh, 100%);
        transform: translateY(var(--vvtop, 0px));
        max-width: none;
        padding: 8px 8px calc(8px + env(safe-area-inset-bottom));
        gap: 6px;
        overflow: hidden;
        overscroll-behavior: none;
      }
      body.mobile.keyboard { padding-bottom: 6px; }
      body.mobile #commands { display: none; }
      /* iOS は 16px 未満の入力欄で自動拡大して画面が跳ねるため 16px にする */
      body.mobile textarea { min-height: 0; padding: 10px; font-size: 16px; line-height: 1.7; }
      body.mobile footer { order: 8; }
      body.mobile #picker { order: 9; flex: none; max-height: 40%; overflow-y: auto; }
      body.mobile #picker .btn { padding: 8px 12px; font-size: 14px; }
      body.mobile .mobile-bar { order: 10; display: flex; flex: none; gap: 4px; }
      .mobile-bar .btn { flex: 1; min-width: 0; padding: 10px 2px; font-size: 14px; }
      .mobile-bar .btn.active { background: var(--accent); border-color: var(--accent); color: var(--bg); font-weight: bold; }
      .mobile-bar .kb-close { display: none; flex: none; padding: 10px 8px; }
      /* キーボード表示中は、作品の読み込み欄・保存ボタン・チェック結果を隠して本文を広くする */
      body.mobile.keyboard header,
      body.mobile.keyboard footer,
      body.mobile.keyboard #problems { display: none; }
      body.mobile.keyboard .mobile-bar .kb-close { display: block; }
      body.mobile .toast { position: absolute; bottom: auto; top: 8px; }
      .help { font-size: 12px; color: var(--text-sub); }
      .help a { color: var(--accent); }
    </style>
  </head>
  <body>
    <header>
      <h1>シナリオエディタ</h1>
      <span class="story">作品：</span>
      <select id="story-select"><option value="">（選ばなくても使えます）</option></select>
      <input type="text" id="story-id" placeholder="作品ID を直接入力" size="14" />
      <button class="btn" id="story-load">読み込む</button>
      <span class="story" id="story-status"></span>
    </header>

    <div class="bar" id="commands"></div>
    <div class="bar" id="picker"></div>

    <textarea id="editor" spellcheck="false" placeholder="ボタンでコマンドを入れて、その下に文章を書きます。"></textarea>
    <ul id="problems"></ul>

    <footer>
      <button class="btn primary" id="download">ダウンロード</button>
      <input type="text" id="filename" value="episode_01.txt" size="16" title="ダウンロードするファイル名" />
      <button class="btn" id="copy">コピー</button>
      <label class="btn">ファイルを開く<input type="file" id="open" accept=".txt,text/plain" hidden /></label>
      <button class="btn" id="clear">新規</button>
      <span class="help">書き方は <a href="https://github.com/CaitaKenchikuClub/ClaudeGame006/blob/main/docs/シナリオの書き方.md" target="_blank" rel="noopener">シナリオの書き方</a></span>
    </footer>

    <!-- スマホ用のコマンドバー（キーボードのすぐ上に出る） -->
    <nav class="mobile-bar" id="mobile-bar" aria-label="コマンド"></nav>
    <span class="toast" id="toast" role="status"></span>

    <script>
      'use strict';

      const editor = document.getElementById('editor');
      const picker = document.getElementById('picker');
      const STORAGE_KEY = 'novel-collab-scenario-editor';

      // 作品を読み込むと、登録済みの名前がここに入る
      const emptyNames = () => ({ characters: [], fullBody: [], expressions: {}, backgrounds: [], stills: [], bgm: [], se: [] });
      let names = emptyNames();
      let storyLoaded = false;

      // ---------- コマンドのボタン ----------
      // kind：名前の候補の種類。line：入れる文字。none：「なし」も候補に出す
      // cat：スマホのコマンドバーでの分類。short：分類の中で使う短い名前
      const COMMANDS = [
        { label: '背景', cat: '背景', kind: 'backgrounds', line: (n) => `#背景 ${n}` },
        { label: 'キャラ（中央）', cat: 'キャラ', short: '中央に出す', kind: 'characters', withFull: true, line: (n) => `#キャラ画像 ${n}` },
        { label: 'キャラ（左）', cat: 'キャラ', short: '左に出す', kind: 'characters', withFull: true, line: (n) => `#キャラ画像左 ${n}`, none: true },
        { label: 'キャラ（右）', cat: 'キャラ', short: '右に出す', kind: 'characters', withFull: true, line: (n) => `#キャラ画像右 ${n}`, none: true },
        { label: 'キャラを全部消す', cat: 'キャラ', short: '全部消す', line: () => '#キャラ画像 なし' },
        { label: '台詞', cat: '文章', kind: 'characters', line: (n) => `#台詞 ${n}` },
        // plain：キャラを指定しない候補（三人称の地の文）。選ぶと line(null) が入る
        { label: 'モノローグ', cat: '文章', kind: 'characters', plain: 'キャラ指定なし（三人称）', line: (n) => (n === null ? '#モノローグ' : `#モノローグ ${n}`) },
        { label: '表情', cat: 'キャラ', kind: 'expressions', line: (n) => `#表情 ${n}` },
        { label: 'スチル', cat: '演出', kind: 'stills', line: (n) => `#スチル ${n}`, none: true },
        { label: 'BGM', cat: '演出', kind: 'bgm', line: (n) => `#BGM ${n}`, none: true },
        { label: '効果音', cat: '演出', kind: 'se', line: (n) => `#効果音 ${n}` },
        { label: '終了', cat: 'その他', line: () => '#終了' },
      ];
      const CATEGORIES = ['背景', 'キャラ', '文章', '演出', 'その他'];

      const makeButton = (label, onClick, className = 'btn') => {
        const b = document.createElement('button');
        b.type = 'button';
        b.className = className;
        b.textContent = label;
        b.addEventListener('click', onClick);
        return b;
      };

      // PC：すべてのコマンドを上に並べる
      const commandBar = document.getElementById('commands');
      for (const cmd of COMMANDS) commandBar.append(makeButton(cmd.label, () => onCommand(cmd), 'btn cmd'));

      // スマホ：分類ごとのボタン。押すとその分類のコマンドを選ぶ欄が開く
      const mobileBar = document.getElementById('mobile-bar');
      const categoryButtons = new Map();
      for (const cat of CATEGORIES) {
        const b = makeButton(cat, () => (openCategory === cat ? closePicker() : showCategory(cat)), 'btn cmd');
        categoryButtons.set(cat, b);
        mobileBar.append(b);
      }
      // キーボードを閉じて、保存などのボタンを出す
      mobileBar.append(makeButton('完了', () => { closePicker(); editor.blur(); }, 'btn kb-close'));

      // コマンドのボタンを押しても入力欄からフォーカスが外れないようにする
      // （キーボードが閉じず、カーソル位置・選択範囲・変換中の文字がそのまま残る）
      for (const el of [commandBar, picker, mobileBar]) {
        el.addEventListener('mousedown', (e) => e.target.closest('button') && e.preventDefault());
      }

      /** 今開いている分類（スマホ） */
      let openCategory = null;
      function showCategory(cat) {
        const cmds = COMMANDS.filter((c) => c.cat === cat);
        if (cmds.length === 1) {
          // 1つしかない分類（背景・その他）は、すぐにそのコマンドへ
          onCommand(cmds[0], cat);
          return;
        }
        showPanel(`「${cat}」のコマンドを選んでください`, [
          ...cmds.map((c) => makeButton(c.short ?? c.label, () => onCommand(c, cat), 'btn cmd')),
          makeButton('閉じる', closePicker),
        ], cat);
      }

      /** cat：スマホの分類から選んだとき、その分類（「戻る」に使う） */
      function onCommand(cmd, cat = null) {
        if (!cmd.kind) {
          closePicker();
          insertCommand(cmd.line());
          return;
        }
        // 表情は「キャラ名 表情名」の組み合わせを候補にする
        const options =
          cmd.kind === 'expressions'
            ? Object.entries(names.expressions).flatMap(([c, list]) => list.map((e) => `${c} ${e}`)).concat(names.characters.map((c) => `${c} なし`))
            : [
                ...names[cmd.kind],
                // 全身の画像があるキャラは「キャラ名 全身」も選べる
                ...(cmd.withFull ? names.fullBody.map((n) => `${n} 全身`) : []),
                ...(cmd.none ? ['なし'] : []),
              ];
        // 登録済みの名前がなくても選択欄を出し、「ほかの名前（手で書く）」を選べるようにする
        const registered = options.filter((o) => o !== 'なし').length;
        if (cmd.plain) options.unshift(cmd.plain);
        openPicker(cmd, options, registered === 0, cat);
      }

      function openPicker(cmd, options, noNames, cat) {
        const message = !noNames
          ? `「${cmd.label}」に入れる名前を選んでください`
          : storyLoaded
            ? `「${cmd.label}」に登録されている名前はありません。「ほかの名前（手で書く）」を選んでください`
            : `作品を読み込むと、「${cmd.label}」に登録されている名前から選べます`;
        const hasBack = cat && COMMANDS.filter((c) => c.cat === cat).length > 1;
        showPanel(message, [
          ...options.map((opt) =>
            makeButton(opt, () => {
              closePicker();
              insertCommand(cmd.line(opt === cmd.plain ? null : opt));
            }),
          ),
          makeButton('ほかの名前（手で書く）', () => {
            closePicker();
            insertCommand(cmd.line(''), true);
          }),
          ...(hasBack ? [makeButton('‹ 戻る', () => showCategory(cat))] : []),
          makeButton('やめる', () => {
            closePicker();
            restoreEditorFocus();
          }),
        ], cat);
      }

      /** 選択欄に案内文とボタンを出す（PC は上、スマホはコマンドバーのすぐ上） */
      function showPanel(message, buttons, cat = null) {
        const label = document.createElement('div');
        label.className = 'label';
        label.textContent = message;
        picker.replaceChildren(label, ...buttons);
        picker.scrollTop = 0;
        picker.classList.add('open');
        setOpenCategory(cat);
        keepCaretVisibleSoon();
      }
      function closePicker() {
        picker.classList.remove('open');
        setOpenCategory(null);
        keepCaretVisibleSoon();
      }
      function setOpenCategory(cat) {
        openCategory = cat;
        for (const [c, b] of categoryButtons) b.classList.toggle('active', c === cat);
      }

      // ---------- カーソル位置の記憶 ----------
      // 入力欄からフォーカスが外れても、最後のカーソル位置・選択範囲に入れられるよう覚えておく
      let savedSelection = { start: 0, end: 0 };
      /** 日本語入力の変換中なら true */
      let composing = false;
      const rememberSelection = () => {
        if (document.activeElement === editor && !composing) {
          savedSelection = { start: editor.selectionStart, end: editor.selectionEnd };
        }
      };
      for (const type of ['select', 'keyup', 'mouseup', 'touchend', 'input', 'focus']) {
        editor.addEventListener(type, () => setTimeout(rememberSelection, 0));
      }
      document.addEventListener('selectionchange', rememberSelection);
      editor.addEventListener('compositionstart', () => (composing = true));
      editor.addEventListener('compositionend', () => {
        composing = false;
        setTimeout(rememberSelection, 0);
      });

      /** 入力欄にフォーカスを戻し、覚えておいたカーソル位置・選択範囲に戻す */
      function restoreEditorFocus() {
        if (document.activeElement === editor) return;
        editor.focus({ preventScroll: true });
        const len = editor.value.length;
        editor.setSelectionRange(Math.min(savedSelection.start, len), Math.min(savedSelection.end, len));
      }

      /**
       * 変換中の文字を確定させてから続ける。
       * カーソル位置を設定し直すと多くのブラウザは確定するが、確定しなければ何もしない（入力中の文字を壊さないため）
       */
      function afterComposition(action) {
        if (!composing) {
          action();
          return;
        }
        let finished = false;
        const finish = (ok) => {
          if (finished) return;
          finished = true;
          editor.removeEventListener('compositionend', onEnd);
          if (ok) action();
          else toast('変換中の文字を確定してから、もう一度コマンドを選んでください');
        };
        const onEnd = () => setTimeout(() => finish(true), 0);
        editor.addEventListener('compositionend', onEnd);
        const pos = editor.selectionEnd;
        editor.setSelectionRange(pos, pos);
        setTimeout(() => finish(!composing), 400);
      }

      /**
       * カーソルのある行にコマンドを1行で入れる（行に文字があれば、その下の行に入れる）。
       * 文章を選択しているときは、選んだ文章を消さないよう、その最初の行の上に入れる。
       * typeName：名前を手で書くので、コマンドの行末にカーソルを残す
       */
      function insertCommand(line, typeName = false) {
        restoreEditorFocus();
        afterComposition(() => {
          if (editor.selectionStart !== editor.selectionEnd) insertAboveSelection(line, typeName);
          else insertAtCaret(line, typeName);
          rememberSelection();
          save();
          check();
          keepCaretVisibleSoon();
        });
      }

      /** 直前の行が文章なら1行空けて、コマンドのまとまりを見やすくする */
      const needsGap = (prevLine) => prevLine.trim() !== '' && !/^[#＃]/.test(prevLine.trim());

      function insertAboveSelection(line, typeName) {
        const v = editor.value;
        const { selectionStart: start, selectionEnd: end } = editor;
        const lineStart = v.lastIndexOf('\n', start - 1) + 1;
        const prevLine = lineStart > 0 ? v.slice(v.lastIndexOf('\n', lineStart - 2) + 1, lineStart - 1) : '';
        const gap = needsGap(prevLine) ? '\n' : '';
        const text = gap + line + '\n';
        editor.setSelectionRange(lineStart, lineStart);
        insertText(text);
        // 名前を手で書くときはコマンドの行末へ、それ以外は選択していた文章の終わりへ
        const caret = typeName ? lineStart + gap.length + line.length : end + text.length;
        editor.setSelectionRange(caret, caret);
      }

      function insertAtCaret(line, typeName) {
        const v = editor.value;
        const pos = editor.selectionStart;
        const lineStart = v.lastIndexOf('\n', pos - 1) + 1;
        const lineEnd = v.indexOf('\n', pos) === -1 ? v.length : v.indexOf('\n', pos);
        const current = v.slice(lineStart, lineEnd);
        const emptyLine = current.trim() === '';
        // 空の行ならその行に、文字がある行ならその下に入れる
        const prevLine = emptyLine ? v.slice(v.lastIndexOf('\n', lineStart - 2) + 1, Math.max(lineStart - 1, 0)) : current;
        // 直前が文章なら1行空けて、コマンドのまとまりを見やすくする
        const gap = lineStart > 0 || !emptyLine ? (needsGap(prevLine) ? '\n' : '') : '';
        const text = (emptyLine ? '' : '\n') + gap + line + (typeName ? '' : '\n');
        if (emptyLine) editor.setSelectionRange(lineStart, lineEnd);
        else editor.setSelectionRange(lineEnd, lineEnd);
        insertText(text);
      }

      /** 元に戻す（Ctrl+Z）が効くように、ブラウザの入力として文字を入れる */
      function insertText(text) {
        const ok = document.execCommand && document.execCommand('insertText', false, text);
        if (!ok) {
          editor.setRangeText(text, editor.selectionStart, editor.selectionEnd, 'end');
        }
      }

      // ---------- 編集中の行を見えるようにする ----------
      const MIRROR_STYLES = ['boxSizing', 'width', 'paddingTop', 'paddingRight', 'paddingBottom', 'paddingLeft', 'borderTopWidth',
        'borderRightWidth', 'borderBottomWidth', 'borderLeftWidth', 'fontFamily', 'fontSize', 'fontWeight', 'lineHeight', 'letterSpacing', 'tabSize'];
      /** カーソルの行の上端（入力欄の中での位置）。折り返しも反映するため、同じ見た目の見えない要素で測る */
      function caretTop() {
        const style = getComputedStyle(editor);
        const mirror = document.createElement('div');
        for (const key of MIRROR_STYLES) mirror.style[key] = style[key];
        Object.assign(mirror.style, { position: 'absolute', top: '0', left: '-9999px', visibility: 'hidden', whiteSpace: 'pre-wrap', overflowWrap: 'break-word' });
        mirror.style.width = editor.clientWidth + 'px';
        mirror.style.borderWidth = '0';
        mirror.textContent = editor.value.slice(0, editor.selectionEnd);
        const marker = document.createElement('span');
        marker.textContent = '\u200b';
        mirror.append(marker);
        document.body.append(mirror);
        const top = marker.offsetTop;
        mirror.remove();
        return top;
      }
      /** カーソルの行が入力欄の外に出ていたら、入力欄の中だけをスクロールして見えるようにする */
      function keepCaretVisible() {
        if (document.activeElement !== editor) return;
        const lineHeight = parseFloat(getComputedStyle(editor).lineHeight) || 24;
        const top = caretTop();
        if (top < editor.scrollTop) editor.scrollTop = top - lineHeight / 2;
        else if (top + lineHeight * 1.5 > editor.scrollTop + editor.clientHeight) {
          editor.scrollTop = top + lineHeight * 1.5 - editor.clientHeight;
        }
      }
      const keepCaretVisibleSoon = () => requestAnimationFrame(keepCaretVisible);

      // ---------- スマホの画面の大きさ（キーボード対応） ----------
      const mobileQuery = matchMedia('(pointer: coarse) and (max-width: 900px)');
      /** キーボードを閉じているときの高さ（これより十分低ければキーボードが出ている） */
      let fullHeight = 0;
      let lastWidth = 0;
      let lastHeight = 0;
      function updateLayout() {
        const mobile = mobileQuery.matches;
        document.body.classList.toggle('mobile', mobile);
        if (!mobile) {
          document.body.classList.remove('keyboard');
          return;
        }
        const vv = window.visualViewport;
        const width = vv ? vv.width : window.innerWidth;
        const height = vv ? vv.height : window.innerHeight;
        if (Math.abs(width - lastWidth) > 1) fullHeight = 0; // 画面の向きが変わったら測り直す
        lastWidth = width;
        fullHeight = Math.max(fullHeight, window.innerHeight, height);
        document.body.style.setProperty('--vvh', `${height}px`);
        document.body.style.setProperty('--vvtop', `${vv ? vv.offsetTop : 0}px`);
        // 画面のキーボードが出ていて、本文を書いているとき（ハードウェアキーボードでは高さが変わらないので隠さない）
        const keyboard = height < fullHeight - 120 && document.activeElement === editor;
        document.body.classList.toggle('keyboard', keyboard);
        if (Math.abs(height - lastHeight) > 1) {
          lastHeight = height;
          keepCaretVisibleSoon();
        }
      }
      window.visualViewport?.addEventListener('resize', updateLayout);
      window.visualViewport?.addEventListener('scroll', updateLayout);
      window.addEventListener('resize', updateLayout);
      mobileQuery.addEventListener?.('change', updateLayout);
      editor.addEventListener('focus', () => setTimeout(updateLayout, 0));
      editor.addEventListener('blur', () => setTimeout(updateLayout, 0));

      // ---------- かんたんチェック ----------
      const KNOWN = ['背景', 'キャラ画像', 'キャラ画像左', 'キャラ画像右', '台詞', 'モノローグ', 'スチル', '終了', '表情', 'BGM', 'ＢＧＭ', 'bgm', '効果音'];
      function check() {
        const problems = [];
        const lines = editor.value.split(/\r\n|\r|\n/);
        lines.forEach((raw, i) => {
          const t = raw.trim();
          if (!/^[#＃]/.test(t)) return;
          const [cmd, ...args] = t.slice(1).split(/[ 　]+/);
          const arg = args.join(' ');
          const at = `${i + 1}行目`;
          if (!KNOWN.includes(cmd)) {
            problems.push(`${at}：「#${cmd}」は知らないコマンドです（文頭に # を書きたいときは \\# と書きます）`);
            return;
          }
          if (!['モノローグ', '終了'].includes(cmd) && !arg) problems.push(`${at}：#${cmd} の後に名前を書いてください`);
          if (!storyLoaded || !arg || arg === 'なし') return;
          const has = (list, name) => list.includes(name);
          if (cmd === 'モノローグ' && !has(names.characters, arg)) problems.push(`${at}：キャラ「${arg}」は登録されていません`);
          if (cmd.startsWith('キャラ画像')) {
            const full = args.length >= 2 && args[args.length - 1] === '全身';
            const name = full ? args.slice(0, -1).join(' ') : arg;
            if (!has(names.characters, name)) problems.push(`${at}：キャラ「${name}」は登録されていません`);
            else if (full && !has(names.fullBody, name)) problems.push(`${at}：キャラ「${name}」の全身の画像は登録されていません`);
          }
          if (cmd === '背景' && !has(names.backgrounds, arg)) problems.push(`${at}：背景「${arg}」は登録されていません`);
          if (cmd === 'スチル' && !has(names.stills, arg)) problems.push(`${at}：スチル「${arg}」は登録されていません`);
          if (/^(BGM|ＢＧＭ|bgm)$/.test(cmd) && !has(names.bgm, arg)) problems.push(`${at}：BGM「${arg}」は登録されていません`);
          if (cmd === '効果音' && !has(names.se, arg)) problems.push(`${at}：効果音「${arg}」は登録されていません`);
          if (cmd === '表情' && args[1] !== 'なし') {
            if (!has(names.characters, args[0])) problems.push(`${at}：キャラ「${args[0]}」は登録されていません`);
            else if (!(names.expressions[args[0]] ?? []).includes(args.slice(1).join(' '))) problems.push(`${at}：「${args[0]}」の表情「${args.slice(1).join(' ')}」は登録されていません`);
          }
        });
        document.getElementById('problems').replaceChildren(
          ...problems.map((p) => Object.assign(document.createElement('li'), { textContent: p })),
        );
      }

      // ---------- 作品の読み込み（公開中のサイトから） ----------
      const storySelect = document.getElementById('story-select');
      const storyId = document.getElementById('story-id');
      const status = document.getElementById('story-status');
      const base = new URL('../stories/', location.href);
      const getJson = async (path) => {
        // 更新直後でも最新の名前を読めるよう、毎回サーバーに新しいか確認する
        const res = await fetch(new URL(path, base), { cache: 'no-cache' });
        if (!res.ok || res.headers.get('content-type')?.includes('text/html')) throw new Error(path);
        return res.json();
      };

      async function loadCatalog() {
        try {
          const catalog = await getJson('catalog.json');
          for (const id of catalog.stories ?? []) {
            const opt = new Option(id, id);
            storySelect.append(opt);
            getJson(`${id}/info.json`).then((info) => (opt.textContent = `${info.title}（${id}）`)).catch(() => {});
          }
        } catch {
          // ファイルを直接開いた場合など。作品を選ばなくても使える
          storySelect.disabled = true;
        }
      }

      async function loadStory(id) {
        id = id.trim();
        if (!id) return;
        status.textContent = '読み込み中…';
        try {
          // characters.json・assets.json はなくてもよいので、片方ずつ読む。info.json で作品があるかを確かめる
          await getJson(`${id}/info.json`);
          const [chars, assets] = await Promise.all([
            getJson(`${id}/characters.json`).catch(() => ({})),
            getJson(`${id}/assets.json`).catch(() => ({})),
          ]);
          const list = chars.characters ?? [];
          names = {
            characters: list.map((c) => c.name).filter(Boolean),
            fullBody: list.filter((c) => c.full).map((c) => c.name).filter(Boolean),
            expressions: Object.fromEntries(list.map((c) => [c.name, Object.keys(c.expressions ?? {})]).filter(([, e]) => e.length)),
            backgrounds: Object.keys(assets.backgrounds ?? {}),
            stills: Object.keys(assets.stills ?? {}),
            bgm: Object.keys(assets.bgm ?? {}),
            se: Object.keys(assets.se ?? {}),
          };
          storyLoaded = true;
          status.textContent = `「${id}」の名前を読み込みました（キャラ ${names.characters.length}・背景 ${names.backgrounds.length}）`;
          try { localStorage.setItem(STORAGE_KEY + ':story', id); } catch {}
        } catch {
          storyLoaded = false;
          names = emptyNames();
          status.textContent = `「${id}」を読み込めませんでした（公開前の作品は、GitHub に保存して数分後に読み込めます）`;
        }
        check();
      }

      storySelect.addEventListener('change', () => {
        storyId.value = storySelect.value;
        loadStory(storySelect.value);
      });
      document.getElementById('story-load').addEventListener('click', () => loadStory(storyId.value));
      storyId.addEventListener('keydown', (e) => e.key === 'Enter' && loadStory(storyId.value));

      // ---------- 保存・ファイル ----------
      let toastTimer;
      function toast(msg) {
        const t = document.getElementById('toast');
        t.textContent = msg;
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => (t.textContent = ''), 2500);
      }
      function save() {
        try {
          localStorage.setItem(STORAGE_KEY, editor.value);
          localStorage.setItem(STORAGE_KEY + ':file', document.getElementById('filename').value);
        } catch {}
      }
      let timer;
      editor.addEventListener('input', () => {
        clearTimeout(timer);
        timer = setTimeout(() => { save(); check(); }, 300);
      });

      document.getElementById('download').addEventListener('click', () => {
        let name = document.getElementById('filename').value.trim() || 'episode_01.txt';
        if (!name.endsWith('.txt')) name += '.txt';
        // 最後は改行で終わらせる。UTF-8 で保存される
        const text = editor.value.endsWith('\n') ? editor.value : editor.value + '\n';
        const url = URL.createObjectURL(new Blob([text], { type: 'text/plain;charset=utf-8' }));
        Object.assign(document.createElement('a'), { href: url, download: name }).click();
        setTimeout(() => URL.revokeObjectURL(url), 1000);
      });
      document.getElementById('copy').addEventListener('click', async () => {
        try {
          await navigator.clipboard.writeText(editor.value);
        } catch {
          editor.select();
          document.execCommand('copy');
        }
        toast('コピーしました');
      });
      document.getElementById('open').addEventListener('change', async (e) => {
        const file = e.target.files[0];
        if (!file) return;
        editor.value = (await file.text()).replace(/^﻿/, '');
        savedSelection = { start: 0, end: 0 };
        document.getElementById('filename').value = file.name;
        e.target.value = '';
        save();
        check();
        toast(`${file.name} を開きました`);
      });
      document.getElementById('clear').addEventListener('click', () => {
        if (editor.value && !confirm('今の内容を消して、新しく書き始めますか？')) return;
        editor.value = '';
        savedSelection = { start: 0, end: 0 };
        save();
        check();
        editor.focus();
      });
      document.getElementById('filename').addEventListener('change', save);

      // ---------- 起動 ----------
      try {
        editor.value = localStorage.getItem(STORAGE_KEY) ?? '';
        document.getElementById('filename').value = localStorage.getItem(STORAGE_KEY + ':file') || 'episode_01.txt';
      } catch {}
      // まだ入力欄を触っていなければ、文章の最後に入れる
      savedSelection = { start: editor.value.length, end: editor.value.length };
      updateLayout();
      loadCatalog();
      try {
        const last = localStorage.getItem(STORAGE_KEY + ':story');
        if (last) {
          storyId.value = last;
          loadStory(last);
        }
      } catch {}
      check();
    </script>
  </body>
</html>
